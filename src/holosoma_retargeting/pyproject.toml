[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holosoma-retargeting"
version = "0.1.0"
description = "Retargeting utilities for converting human motions to robot motions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Amazon FAR Team" },
]
dependencies = [
    # Allow numpy 1.26.x (for isaacsim/isaaclab envs) up to <2.4.
    # reason: numpy 2.4+ triggers "TypeError: only 0-dimensional arrays can
    # be converted to Python scalars" in yourdf/urdf.py::1078 when
    # converting float(q). numpy 1.26.x and 2.0-2.3 are unaffected.
    "numpy>=1.26,<2.4",
    "torch",
    "tqdm",
    "scipy",
    "matplotlib",
    "trimesh",
    "smplx",
    "jinja2",
    "mujoco",
    "viser",
    "robot_descriptions",
    "yourdfpy",
    "cvxpy",
    "libigl",
    "tyro",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["holosoma_retargeting*"]
